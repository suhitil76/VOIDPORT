<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOIDPORT — The City That Forgot to Live</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #050510;
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        color: #d1dbe5;
      }
      #webgl-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 1;
      }
      /* Minimalist cinematic viewport overlay */
      #hud {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 24px;
      }
      .hud-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .brand-title {
        letter-spacing: 0.28em;
        font-size: 1.25rem;
        font-weight: 800;
        color: #f0abfc;
        text-shadow: 0 0 16px rgba(217, 70, 239, 0.6);
      }
      .brand-sub {
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        color: #94a3b8;
        margin-top: 4px;
        text-transform: uppercase;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(13, 11, 28, 0.75);
        border: 1px solid rgba(217, 70, 239, 0.35);
        padding: 7px 16px;
        border-radius: 9999px;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        backdrop-filter: blur(10px);
        color: #e2e8f0;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ef4444;
        box-shadow: 0 0 10px #ef4444;
        transition: background 0.6s ease, box-shadow 0.6s ease;
      }
      .status-dot.active {
        background: #00f0ff;
        box-shadow: 0 0 14px #00f0ff;
      }

      /* Control deck */
      .hud-footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }
      .view-controls {
        display: flex;
        gap: 8px;
        pointer-events: auto;
        background: rgba(10, 10, 24, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 6px;
        border-radius: 12px;
        backdrop-filter: blur(14px);
      }
      .view-btn {
        background: transparent;
        border: 1px solid transparent;
        color: #94a3b8;
        padding: 8px 14px;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.25s ease;
      }
      .view-btn:hover {
        color: #fdf4ff;
        background: rgba(217, 70, 239, 0.12);
      }
      .view-btn.active {
        color: #f0abfc;
        background: rgba(217, 70, 239, 0.2);
        border-color: rgba(217, 70, 239, 0.5);
        box-shadow: 0 0 12px rgba(217, 70, 239, 0.25);
      }
      .action-controls {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        pointer-events: auto;
      }
      .key-hints {
        font-size: 0.68rem;
        letter-spacing: 0.1em;
        color: #64748b;
        background: rgba(10, 10, 22, 0.6);
        padding: 4px 10px;
        border-radius: 6px;
      }
      .awaken-btn {
        background: linear-gradient(135deg, rgba(217, 70, 239, 0.3), rgba(168, 85, 247, 0.45));
        border: 1px solid rgba(217, 70, 239, 0.6);
        color: #fdf4ff;
        padding: 10px 22px;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        border-radius: 8px;
        cursor: pointer;
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 20px rgba(217, 70, 239, 0.25);
        transition: all 0.3s ease;
      }
      .awaken-btn:hover {
        background: linear-gradient(135deg, rgba(217, 70, 239, 0.5), rgba(168, 85, 247, 0.7));
        border-color: rgba(217, 70, 239, 0.9);
        box-shadow: 0 0 25px rgba(217, 70, 239, 0.5);
      }
      .awaken-btn.awakened {
        background: linear-gradient(135deg, rgba(239, 68, 68, 0.3), rgba(185, 28, 28, 0.45));
        border-color: rgba(239, 68, 68, 0.6);
        box-shadow: 0 4px 20px rgba(239, 68, 68, 0.25);
      }

      /* First-person center reticle */
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 8px;
        height: 8px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 15;
      }
      #crosshair::before, #crosshair::after {
        content: '';
        position: absolute;
        background: rgba(240, 171, 252, 0.7);
      }
      #crosshair::before {
        top: 3px; left: 0; width: 8px; height: 2px;
      }
      #crosshair::after {
        top: 0; left: 3px; width: 2px; height: 8px;
      }

      /* Cinematic letterbox edge vignette */
      .vignette-frame {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        box-shadow: inset 0 0 130px rgba(3, 4, 10, 0.88);
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <canvas id="webgl-canvas"></canvas>
    <div class="vignette-frame"></div>
    <div id="crosshair"></div>

    <div id="hud">
      <div class="hud-header">
        <div>
          <div class="brand-title">VOIDPORT</div>
          <div class="brand-sub">The City That Forgot to Live &middot; Sector 01: The Core</div>
        </div>
        <div class="status-pill">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-text">CITY DORMANT</span>
        </div>
      </div>

      <div class="hud-footer">
        <div class="view-controls">
          <button class="view-btn active" data-view="ground">1. Street Level (FPS)</button>
          <button class="view-btn" data-view="tower">2. Landmark Spire</button>
          <button class="view-btn" data-view="architecture">3. Architecture &amp; Skybridge</button>
          <button class="view-btn" data-view="aerial">4. Aerial Overview</button>
        </div>
        <div class="action-controls">
          <div class="key-hints">WASD: Walk &middot; Shift: Sprint &middot; Space: Jump &middot; E: Interact &middot; M: Toggle View</div>
          <button class="awaken-btn" id="awaken-btn">INITIALIZE SUBSTATION</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
